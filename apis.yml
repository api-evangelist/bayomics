name: bayomics
description: >-
  Bayomics (贝普奥生物) is a Shenzhen-based biotechnology company specializing in spatial
  proteomics and trace (micro) proteomics solutions for pharmaceutical research and drug
  development. Its product lines include the SISPROT protein sample-preparation kits built on
  proprietary Spintip centrifuge-pipette technology that process nanogram-level samples in
  roughly two hours, VistaProX spatial visualization proteomics combining immunofluorescence
  staining with high-depth mass-spectrometry detection on a single slice, and high-throughput
  automation systems capable of processing up to 400 proteomics samples per day. Bayomics
  operates as a B2B reagent supplier and research-services provider and does not currently
  publish any public developer API, SDKs, or programmatic developer resources. This profile was
  surfaced as a portfolio company of Qiming Venture Partners and added to the API Evangelist
  network for enrichment.
